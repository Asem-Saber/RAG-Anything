model_list:
  - model_name: "chat"
    litellm_params:
      model: "openrouter/openai/gpt-4o-mini"
      api_key: "os.environ/OPENROUTER_API_KEY"
      api_base: "https://openrouter.ai/api/v1"
      max_tokens: 4096
      timeout: 120

  - model_name: "chat-local"
    litellm_params:
      model: "ollama_chat/gemma3:4b"
      api_base: "os.environ/OLLAMA_ENDPOINT"
      timeout: 300

  - model_name: "judge"
    litellm_params:
      model: "openrouter/openai/gpt-4o-mini"
      api_key: "os.environ/OPENROUTER_API_KEY"
      api_base: "https://openrouter.ai/api/v1"
      max_tokens: 2048
      timeout: 60

  - model_name: "embedding"
    litellm_params:
      model: "openrouter/qwen/qwen3-embedding-8b"
      api_key: "os.environ/OPENROUTER_API_KEY"
      api_base: "https://openrouter.ai/api/v1"
      timeout: 60

litellm_settings:
  num_retries: 3
  request_timeout: 120       
  allowed_fails: 3
  cooldown_time: 120
  drop_params: True          
  fallbacks: [{"chat": ["chat-local"]}]


general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"


router_settings:
  routing_strategy: simple-shuffle