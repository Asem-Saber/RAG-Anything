[project]
name = "rag-anything"
version = "0.1.0"
description = "Multi-user RAG over your own documents, with citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.7.0",
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]==2.0.49",
    "structlog>=24.4.0",
    "litellm[proxy]>=1.83.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_anything"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]      # hardcoded test passwords are intentional
"migrations/**" = ["E501", "F403", "F401"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rag_anything"]
files = ["tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL",
]